<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lisans Panel</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      input,
      button {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h2>Lisans Oluştur</h2>

    <input id="hwid" placeholder="HWID" />
    <input id="days" type="number" value="30" />
    <input id="pass" type="password" placeholder="Admin Şifre" />

    <button onclick="send()">Oluştur</button>

    <pre id="out"></pre>

    <script>
      async function send() {
        const r = await fetch(
          "https://license-api.a-berkcankurtulus.workers.dev",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + document.getElementById("pass").value,
            },
            body: JSON.stringify({
              hwid: hwid.value,
              days: +days.value,
            }),
          }
        );
        out.textContent = await r.text();
      }
    </script>
  </body>
</html>
